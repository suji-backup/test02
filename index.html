<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVE & INFO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #F4F7F5;
      --surface: #FFFFFF;
      --surface-sub: #F9FBFA;
      --primary: #143D2B;
      --primary-hover: #1E563D;
      --accent-soft: #E6F0EC;
      --border-strong: #143D2B;
      --border-light: #D1DDD6;
      --text-main: #111C17;
      --text-sub: #52665C;
      --danger: #8B2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      display: flex;
      justify-content: center;
      padding: 48px 20px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
    }

    header {
      padding: 28px 36px;
      border-bottom: 1px solid var(--border-strong);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      gap: 16px;
    }

    .header-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-sub);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }

    header h1 {
      font-family: 'Inter', sans-serif;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--primary);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-sharp {
      font-family: 'JetBrains Mono', 'Noto Sans KR', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--primary);
      border: 1px solid var(--border-strong);
      padding: 7px 14px;
      background: var(--surface);
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-sharp:hover {
      background: var(--accent-soft);
    }

    .btn-sharp.active-mode {
      background: var(--primary);
      color: #FFFFFF;
    }

    .btn-sharp.danger {
      color: var(--danger);
      border-color: var(--danger);
    }

    .btn-sharp.danger:hover {
      background: var(--danger);
      color: #FFFFFF;
    }

    .edit-toolbar {
      display: none;
      background: var(--accent-soft);
      border-bottom: 1px solid var(--border-strong);
      padding: 12px 36px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    body.is-editing .edit-toolbar {
      display: flex;
    }

    .toolbar-info {
      font-family: 'JetBrains Mono', 'Noto Sans KR', sans-serif;
      font-size: 0.76rem;
      color: var(--primary);
      font-weight: 600;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border-strong);
      background: var(--surface-sub);
    }

    .tab-btn {
      padding: 16px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      background: transparent;
      color: var(--text-sub);
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn:first-child {
      border-right: 1px solid var(--border-strong);
    }

    .tab-btn:hover {
      background: var(--accent-soft);
      color: var(--primary);
    }

    .tab-btn.active {
      background: var(--primary);
      color: #FFFFFF;
    }

    .tab-content {
      display: none;
      padding: 36px;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 28px;
      padding-bottom: 32px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border-light);
      align-items: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border: 1px solid var(--border-strong);
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--primary);
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-edit-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(20, 61, 43, 0.85);
      color: #FFFFFF;
      font-family: 'JetBrains Mono', sans-serif;
      font-size: 0.72rem;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      padding: 6px;
    }

    body.is-editing .avatar-edit-overlay {
      display: flex;
    }

    .profile-info h2 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .profile-info p {
      color: var(--text-sub);
      font-size: 0.92rem;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-sub);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: block;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .tag {
      border: 1px solid var(--border-light);
      background: var(--surface-sub);
      color: var(--text-main);
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tag-remove {
      display: none;
      background: none;
      border: none;
      color: var(--danger);
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }

    body.is-editing .tag-remove {
      display: inline;
    }

    .tag-add-box {
      display: none;
      gap: 6px;
      margin-top: 12px;
    }

    body.is-editing .tag-add-box {
      display: flex;
    }

    .sharp-input, .sharp-textarea {
      width: 100%;
      border: 1px solid var(--border-strong);
      background: var(--surface-sub);
      color: var(--text-main);
      font-family: 'JetBrains Mono', 'Noto Sans KR', sans-serif;
      font-size: 0.85rem;
      padding: 8px 12px;
      outline: none;
    }

    .sharp-input:focus, .sharp-textarea:focus {
      background: #FFFFFF;
    }

    .sharp-textarea {
      min-height: 100px;
      line-height: 1.6;
      resize: vertical;
    }

    .field-group {
      margin-bottom: 14px;
    }

    .field-group:last-child {
      margin-bottom: 0;
    }

    .field-label {
      display: block;
      font-family: 'JetBrains Mono', 'Noto Sans KR', sans-serif;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .folder-menu {
      display: flex;
      border: 1px solid var(--border-strong);
      margin-bottom: 24px;
      background: var(--surface-sub);
    }

    .folder-btn {
      flex: 1;
      background: transparent;
      color: var(--text-sub);
      border: none;
      border-right: 1px solid var(--border-strong);
      padding: 12px 10px;
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .folder-btn:last-child {
      border-right: none;
    }

    .folder-btn:hover {
      background: var(--accent-soft);
      color: var(--primary);
    }

    .folder-btn.active {
      background: var(--primary);
      color: #FFFFFF;
    }

    .add-item-bar {
      display: none;
      margin-bottom: 20px;
    }

    body.is-editing .add-item-bar {
      display: block;
    }

    .add-item-btn {
      width: 100%;
      padding: 12px;
      border: 1px dashed var(--border-strong);
      background: var(--accent-soft);
      color: var(--primary);
      font-family: 'JetBrains Mono', 'Noto Sans KR', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }

    .add-item-btn:hover {
      background: var(--primary);
      color: #FFFFFF;
    }

    .persona-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 18px;
      animation: fadeIn 0.2s ease-out;
    }

    .persona-id-card {
      border: 1px solid var(--border-strong);
      background: var(--surface);
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
      display: flex;
      flex-direction: column;
    }

    .persona-id-card:hover {
      transform: translateY(-3px);
      background: var(--accent-soft);
    }

    .persona-id-photo {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: var(--surface-sub);
      border-bottom: 1px solid var(--border-strong);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: var(--text-sub);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
    }

    .persona-id-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .persona-id-name {
      padding: 10px 12px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .persona-id-hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--primary);
      padding-bottom: 8px;
      text-align: center;
      opacity: 0.75;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17, 28, 23, 0.72);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-backdrop.open {
      display: flex;
      animation: fadeIn 0.18s ease-out;
    }

    .modal-window {
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-strong);
      background: var(--primary);
      color: #FFFFFF;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      padding: 2px 8px;
      border: 1px solid #FFFFFF;
      color: #FFFFFF;
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .modal-close-btn {
      background: transparent;
      border: 1px solid #FFFFFF;
      color: #FFFFFF;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      padding: 4px 12px;
      cursor: pointer;
    }

    .modal-close-btn:hover {
      background: #FFFFFF;
      color: var(--primary);
    }

    .modal-body {
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .modal-top-split {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 20px;
      align-items: start;
    }

    .modal-photo {
      width: 150px;
      aspect-ratio: 3 / 4;
      border: 1px solid var(--border-strong);
      background: var(--surface-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-sub);
      overflow: hidden;
    }

    .modal-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-section-box {
      border: 1px solid var(--border-strong);
      background: var(--surface);
    }

    .modal-section-header {
      padding: 9px 14px;
      background: var(--surface-sub);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-section-label {
      font-family: 'JetBrains Mono', 'Noto Sans KR', sans-serif;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--primary);
      letter-spacing: 0.04em;
    }

    .no-copy-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--text-sub);
    }

    .readonly-text {
      padding: 14px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.88rem;
      line-height: 1.65;
      color: var(--text-main);
      white-space: pre-wrap;
      user-select: none;
    }

    .copyable-text {
      padding: 14px;
      font-family: 'JetBrains Mono', 'Noto Sans KR', sans-serif;
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--text-main);
      white-space: pre-wrap;
      word-break: break-all;
      user-select: all;
    }

    .archive-item {
      border: 1px solid var(--border-strong);
      background: var(--surface);
      margin-bottom: 20px;
      animation: fadeIn 0.2s ease-out;
    }

    .archive-item:last-child {
      margin-bottom: 0;
    }

    .archive-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-light);
      background: var(--surface-sub);
      gap: 12px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .folder-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      padding: 2px 8px;
      border: 1px solid var(--border-strong);
      background: var(--accent-soft);
      color: var(--primary);
      font-weight: 600;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .archive-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .item-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .copy-btn {
      background: var(--surface);
      color: var(--primary);
      border: 1px solid var(--border-strong);
      padding: 5px 12px;
      font-family: 'JetBrains Mono', 'Noto Sans KR', sans-serif;
      font-weight: 500;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .copy-btn:hover, .copy-btn.copied {
      background: var(--primary);
      color: #FFFFFF;
    }

    .archive-media {
      border-bottom: 1px solid var(--border-light);
      background: var(--surface-sub);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .archive-media img {
      max-width: 100%;
      max-height: 360px;
      width: auto;
      height: auto;
      border: 1px solid var(--border-strong);
      display: block;
      object-fit: contain;
    }

    .archive-media.id-ratio img {
      width: 135px;
      height: 180px;
      object-fit: cover;
    }

    .media-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .archive-text {
      padding: 18px;
      font-family: 'JetBrains Mono', 'Noto Sans KR', sans-serif;
      font-size: 0.86rem;
      line-height: 1.65;
      color: var(--text-main);
      background: var(--surface);
      white-space: pre-wrap;
      word-break: break-all;
      user-select: all;
    }

    .edit-body-wrapper {
      padding: 16px;
      background: var(--surface);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      border: 1px dashed var(--border-light);
      color: var(--text-sub);
      font-family: 'JetBrains Mono', 'Noto Sans KR', sans-serif;
      font-size: 0.85rem;
    }

    input[type="file"] {
      display: none;
    }

    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--primary);
      color: #FFFFFF;
      border: 1px solid var(--border-strong);
      padding: 12px 20px;
      font-family: 'JetBrains Mono', 'Noto Sans KR', sans-serif;
      font-size: 0.82rem;
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 3000;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 600px) {
      body {
        padding: 16px 12px;
      }
      header {
        padding: 20px;
        flex-direction: column;
        align-items: flex-start;
      }
      .edit-toolbar {
        padding: 12px 20px;
      }
      .tab-content {
        padding: 24px 20px;
      }
      .profile-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .avatar-wrapper, .avatar {
        width: 84px;
        height: 84px;
      }
      .folder-menu {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .folder-btn:nth-child(2) {
        border-right: none;
      }
      .folder-btn:nth-child(1),
      .folder-btn:nth-child(2) {
        border-bottom: 1px solid var(--border-strong);
      }
      .persona-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .modal-top-split {
        grid-template-columns: 1fr;
      }
      .modal-photo {
        width: 120px;
        margin: 0 auto;
      }
      #toast {
        left: 12px;
        right: 12px;
        bottom: 16px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <span class="header-meta">PERSONAL DIRECTORY // EDITABLE</span>
        <h1>INFO & ARCHIVE</h1>
      </div>
      <div class="header-controls">
        <button id="toggleEditBtn" type="button" class="btn-sharp" onclick="toggleEditMode()">✎ EDIT MODE</button>
      </div>
    </header>

    <div class="edit-toolbar">
      <span class="toolbar-info">● EDITING (자동 저장됨)</span>
      <div class="toolbar-actions">
        <button type="button" class="btn-sharp" onclick="exportHTML()">⬇ HTML 파일로 저장</button>
        <button type="button" class="btn-sharp" onclick="exportJSON()">📤 백업(JSON)</button>
        <button type="button" class="btn-sharp" onclick="document.getElementById('importJsonInput').click()">📥 복원</button>
        <button type="button" class="btn-sharp danger" onclick="resetData()">↺ 초기화</button>
        <input type="file" id="importJsonInput" accept=".json" onchange="importJSON(event)">
      </div>
    </div>

    <nav class="tab-menu">
      <button id="tabBtnInfo" type="button" class="tab-btn active" onclick="openTab('info', this)">01. INFO</button>
      <button id="tabBtnArchive" type="button" class="tab-btn" onclick="openTab('archive', this)">02. ARCHIVE</button>
    </nav>

    <section id="info" class="tab-content active">
      <div class="profile-grid">
        <div class="avatar-wrapper">
          <div class="avatar" id="avatarDisplay">
            <span>IMG_01</span>
          </div>
          <label class="avatar-edit-overlay" for="avatarInput">CHANGE<br>IMAGE</label>
          <input type="file" id="avatarInput" accept="image/*" onchange="handleAvatarUpload(event)">
        </div>
        <div class="profile-info" id="profileInfoArea"></div>
      </div>

      <span class="section-label">Keywords & Tags</span>
      <div class="tag-list" id="tagListArea"></div>
      <div class="tag-add-box">
        <input type="text" id="newTagInput" class="sharp-input" placeholder="새 태그 입력 (예: #ARCHIVING)" style="max-width: 240px;" onkeydown="if(event.key==='Enter') addTag()">
        <button type="button" class="btn-sharp" onclick="addTag()">+ ADD</button>
      </div>
    </section>

    <section id="archive" class="tab-content">
      <div class="folder-menu">
        <button type="button" class="folder-btn active" data-folder="persona" onclick="filterFolder('persona', this)">페르소나</button>
        <button type="button" class="folder-btn" data-folder="prompt" onclick="filterFolder('prompt', this)">프롬프트</button>
        <button type="button" class="folder-btn" data-folder="ooc" onclick="filterFolder('ooc', this)">OOC</button>
        <button type="button" class="folder-btn" data-folder="other" onclick="filterFolder('other', this)">OTHER</button>
      </div>

      <div class="add-item-bar">
        <button type="button" class="add-item-btn" onclick="addNewArchiveItem()">+ 현재 폴더에 새 아카이브 추가</button>
      </div>

      <div id="archiveListArea"></div>
    </section>
  </div>

  <div id="personaModal" class="modal-backdrop" onclick="if(event.target === this) closePersonaModal()">
    <div class="modal-window">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <span class="modal-badge">PERSONA FILE</span>
          <span class="modal-title" id="modalPersonaTitle">페르소나 이름</span>
        </div>
        <button type="button" class="modal-close-btn" onclick="closePersonaModal()">CLOSE [ESC]</button>
      </div>
      <div class="modal-body" id="modalPersonaBody"></div>
    </div>
  </div>

  <div id="toast">COPIED TO CLIPBOARD</div>

  <script>
    const STORAGE_KEY = 'sharp_green_archive_v3';

    const DEFAULT_DATA = {
      profile: {
        name: '닉네임 (Nickname)',
        bio: '개인 프로필 및 작업용 텍스트·이미지 아카이브 공간입니다.\n페르소나 시트, 프롬프트, OOC 지시문 및 기타 양식을 정리해 보관합니다.',
        avatar: ''
      },
      tags: ['#ARCHIVE', '#PERSONA', '#PROMPT', '#OOC'],
      archives: [
        {
          id: 'item-1',
          folder: 'persona',
          title: '페르소나 #01',
          image: '',
          basicInfo: '이름: \n나이 / 성별: \n성격 및 배경 설정: (이 영역은 열람 전용이며 복사 버튼이 제공되지 않습니다.)',
          prompt: '1girl, solo, upper body, portrait, looking at viewer, clean lineart',
          outfitPrompt: 'school uniform, blazer, ribbon, pleated skirt',
          text: ''
        },
        {
          id: 'item-2',
          folder: 'persona',
          title: '페르소나 #02',
          image: '',
          basicInfo: '이름: \n나이 / 성별: \n성격 및 배경 설정: ',
          prompt: '1boy, solo, portrait, sharp eyes, dark hair',
          outfitPrompt: 'black coat, turtleneck sweater, silver necklace',
          text: ''
        },
        {
          id: 'item-3',
          folder: 'prompt',
          title: '메인 스타일 / 렌더링 프롬프트',
          image: '',
          basicInfo: '',
          prompt: '',
          outfitPrompt: '',
          text: '여기에 자주 사용하는 시스템 프롬프트나 이미지 생성 태그를 적어두세요.'
        },
        {
          id: 'item-4',
          folder: 'ooc',
          title: '전개 및 묘사 조율 OOC',
          image: '',
          basicInfo: '',
          prompt: '',
          outfitPrompt: '',
          text: '(OOC: 현재 장면의 심리 묘사와 배경 디테일을 조금 더 깊이 있게 서술해 주세요.)'
        },
        {
          id: 'item-5',
          folder: 'other',
          title: '기타 백업 / HTML 코드 양식',
          image: '',
          basicInfo: '',
          prompt: '',
          outfitPrompt: '',
          text: '상태창 레이아웃, 특수문자, 기타 백업할 텍스트를 자유롭게 보관하세요.'
        }
      ]
    };

    let appData = null;
    let isEditing = false;
    let currentFolder = 'persona';

    function cloneDefaultData() {
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }

    function initApp() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.profile && Array.isArray(parsed.archives)) {
            appData = parsed;
          } else {
            appData = cloneDefaultData();
          }
        } else {
          appData = cloneDefaultData();
        }
      } catch (e) {
        appData = cloneDefaultData();
      }

      if (!Array.isArray(appData.tags)) appData.tags = [];
      renderAll();
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      } catch (e) {
        showToast('저장 공간 부족: 이미지 용량을 줄여주세요.');
      }
    }

    function renderAll() {
      renderProfile();
      renderTags();
      renderArchives();
    }

    function renderProfile() {
      const avatarEl = document.getElementById('avatarDisplay');
      if (!avatarEl) return;
      if (appData.profile.avatar) {
        avatarEl.innerHTML = '<img src="' + appData.profile.avatar + '" alt="Avatar">';
      } else {
        avatarEl.innerHTML = '<span>IMG_01</span>';
      }

      const infoArea = document.getElementById('profileInfoArea');
      if (!infoArea) return;

      if (isEditing) {
        infoArea.innerHTML =
          '<div style="margin-bottom: 10px;">' +
            '<input type="text" class="sharp-input" value="' + escapeHtml(appData.profile.name) + '" placeholder="닉네임" onchange="updateProfile(\'name\', this.value)" style="font-weight:700; font-size:1.1rem;">' +
          '</div>' +
          '<div>' +
            '<textarea class="sharp-textarea" style="min-height:80px;" placeholder="자기소개 입력" onchange="updateProfile(\'bio\', this.value)">' + escapeHtml(appData.profile.bio) + '</textarea>' +
          '</div>' +
          (appData.profile.avatar ? '<button type="button" class="btn-sharp danger" style="margin-top:8px;" onclick="updateProfile(\'avatar\', \'\')">프로필 이미지 삭제</button>' : '');
      } else {
        infoArea.innerHTML =
          '<h2>' + escapeHtml(appData.profile.name) + '</h2>' +
          '<p>' + escapeHtml(appData.profile.bio) + '</p>';
      }
    }

    function updateProfile(field, value) {
      appData.profile[field] = value;
      saveData();
      if (field === 'avatar') renderProfile();
    }

    function handleAvatarUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      compressImage(file, 400, function(base64) {
        updateProfile('avatar', base64);
        showToast('프로필 이미지가 변경되었습니다.');
      });
      event.target.value = '';
    }

    function renderTags() {
      const tagArea = document.getElementById('tagListArea');
      if (!tagArea) return;
      tagArea.innerHTML = appData.tags.map(function(tag, index) {
        return '<span class="tag">' +
          escapeHtml(tag) +
          '<button type="button" class="tag-remove" onclick="removeTag(' + index + ')">×</button>' +
        '</span>';
      }).join('');
    }

    function addTag() {
      const input = document.getElementById('newTagInput');
      let val = input.value.trim();
      if (!val) return;
      if (!val.startsWith('#')) val = '#' + val;
      appData.tags.push(val);
      input.value = '';
      saveData();
      renderTags();
    }

    function removeTag(index) {
      appData.tags.splice(index, 1);
      saveData();
      renderTags();
    }

    function renderArchives() {
      const listArea = document.getElementById('archiveListArea');
      if (!listArea) return;
      const filtered = appData.archives.filter(function(item) {
        return item.folder === currentFolder;
      });

      if (filtered.length === 0) {
        listArea.innerHTML = '<div class="empty-state">이 폴더에는 아직 등록된 자료가 없습니다.</div>';
        return;
      }

      if (currentFolder === 'persona') {
        if (isEditing) {
          listArea.innerHTML = filtered.map(function(item) {
            return '<div class="archive-item">' +
              '<div class="archive-header">' +
                '<div class="title-group">' +
                  '<span class="folder-tag">PERSONA</span>' +
                  '<input type="text" class="sharp-input" value="' + escapeHtml(item.title) + '" placeholder="페르소나 이름" onchange="updateArchive(\'' + item.id + '\', \'title\', this.value)">' +
                '</div>' +
                '<div class="item-actions">' +
                  '<button type="button" class="btn-sharp danger" onclick="deleteArchive(\'' + item.id + '\')">DELETE</button>' +
                '</div>' +
              '</div>' +
              '<div class="archive-media id-ratio">' +
                (item.image ? '<img src="' + item.image + '" alt="ID Photo">' : '<span style="font-family:\'JetBrains Mono\'; font-size:0.76rem; color:var(--text-sub);">[ 증명사진 슬롯 (3:4) ]</span>') +
                '<div class="media-controls">' +
                  '<label class="btn-sharp">+ 증명사진 업로드<input type="file" accept="image/*" onchange="handleArchiveImageUpload(event, \'' + item.id + '\')"></label>' +
                  (item.image ? '<button type="button" class="btn-sharp danger" onclick="updateArchive(\'' + item.id + '\', \'image\', \'\')">사진 제거</button>' : '') +
                '</div>' +
              '</div>' +
              '<div class="edit-body-wrapper">' +
                '<div class="field-group">' +
                  '<label class="field-label">기본 정보 (확대 시 열람 전용 / 복붙 X)</label>' +
                  '<textarea class="sharp-textarea" style="min-height:90px;" placeholder="캐릭터 이름, 나이, 설정 등 기본 정보를 입력하세요." onchange="updateArchive(\'' + item.id + '\', \'basicInfo\', this.value)">' + escapeHtml(item.basicInfo || '') + '</textarea>' +
                '</div>' +
                '<div class="field-group">' +
                  '<label class="field-label">프롬프트 (복붙 O)</label>' +
                  '<textarea class="sharp-textarea" style="min-height:80px;" placeholder="캐릭터 외형 및 특징 프롬프트를 입력하세요." onchange="updateArchive(\'' + item.id + '\', \'prompt\', this.value)">' + escapeHtml(item.prompt || '') + '</textarea>' +
                '</div>' +
                '<div class="field-group">' +
                  '<label class="field-label">의상 프롬프트 (복붙 O)</label>' +
                  '<textarea class="sharp-textarea" style="min-height:70px;" placeholder="의상 관련 프롬프트를 입력하세요." onchange="updateArchive(\'' + item.id + '\', \'outfitPrompt\', this.value)">' + escapeHtml(item.outfitPrompt || '') + '</textarea>' +
                '</div>' +
              '</div>' +
            '</div>';
          }).join('');
        } else {
          listArea.innerHTML = '<div class="persona-grid">' +
            filtered.map(function(item) {
              return '<div class="persona-id-card" onclick="openPersonaModal(\'' + item.id + '\')">' +
                '<div class="persona-id-photo">' +
                  (item.image ? '<img src="' + item.image + '" alt="' + escapeHtml(item.title) + '">' : '<span>NO PHOTO</span>') +
                '</div>' +
                '<div class="persona-id-name">' + escapeHtml(item.title) + '</div>' +
                '<div class="persona-id-hint">[ CLICK TO EXPAND ]</div>' +
              '</div>';
            }).join('') +
          '</div>';
        }
        return;
      }

      listArea.innerHTML = filtered.map(function(item) {
        const supportsImage = (item.folder === 'prompt');
        if (isEditing) {
          return '<div class="archive-item">' +
            '<div class="archive-header">' +
              '<div class="title-group">' +
                '<span class="folder-tag">' + item.folder.toUpperCase() + '</span>' +
                '<input type="text" class="sharp-input" value="' + escapeHtml(item.title) + '" placeholder="제목 입력" onchange="updateArchive(\'' + item.id + '\', \'title\', this.value)">' +
              '</div>' +
              '<div class="item-actions">' +
                '<button type="button" class="btn-sharp danger" onclick="deleteArchive(\'' + item.id + '\')">DELETE</button>' +
              '</div>' +
            '</div>' +
            (supportsImage ?
              '<div class="archive-media">' +
                (item.image ? '<img src="' + item.image + '" alt="preview">' : '<span style="font-family:\'JetBrains Mono\'; font-size:0.78rem; color:var(--text-sub);">[ 첨부된 이미지 없음 ]</span>') +
                '<div class="media-controls">' +
                  '<label class="btn-sharp">+ 이미지 업로드<input type="file" accept="image/*" onchange="handleArchiveImageUpload(event, \'' + item.id + '\')"></label>' +
                  (item.image ? '<button type="button" class="btn-sharp danger" onclick="updateArchive(\'' + item.id + '\', \'image\', \'\')">이미지 제거</button>' : '') +
                '</div>' +
              '</div>' : '') +
            '<div class="edit-body-wrapper">' +
              '<textarea class="sharp-textarea" placeholder="복사할 텍스트 내용을 입력하세요." onchange="updateArchive(\'' + item.id + '\', \'text\', this.value)">' + escapeHtml(item.text || '') + '</textarea>' +
            '</div>' +
          '</div>';
        } else {
          return '<div class="archive-item">' +
            '<div class="archive-header">' +
              '<div class="title-group">' +
                '<span class="folder-tag">' + item.folder.toUpperCase() + '</span>' +
                '<span class="archive-title">' + escapeHtml(item.title) + '</span>' +
              '</div>' +
              '<div class="item-actions">' +
                '<button type="button" class="copy-btn" onclick="copyPlainText(\'' + item.id + '\', \'text\', this)">COPY</button>' +
              '</div>' +
            '</div>' +
            ((supportsImage && item.image) ? '<div class="archive-media"><img src="' + item.image + '" alt="' + escapeHtml(item.title) + '"></div>' : '') +
            '<div class="archive-text">' + escapeHtml(item.text || '') + '</div>' +
          '</div>';
        }
      }).join('');
    }

    function openPersonaModal(id) {
      const item = appData.archives.find(function(i) { return i.id === id; });
      if (!item) return;

      document.getElementById('modalPersonaTitle').innerText = item.title;
      const modalBody = document.getElementById('modalPersonaBody');

      modalBody.innerHTML =
        '<div class="modal-top-split">' +
          '<div class="modal-photo">' +
            (item.image ? '<img src="' + item.image + '" alt="' + escapeHtml(item.title) + '">' : '<span>NO PHOTO</span>') +
          '</div>' +
          '<div class="modal-section-box">' +
            '<div class="modal-section-header">' +
              '<span class="modal-section-label">기본 정보 (BASIC INFO)</span>' +
              '<span class="no-copy-badge">READ ONLY</span>' +
            '</div>' +
            '<div class="readonly-text">' + escapeHtml(item.basicInfo || '등록된 기본 정보가 없습니다.') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="modal-section-box">' +
          '<div class="modal-section-header">' +
            '<span class="modal-section-label">프롬프트 (PROMPT)</span>' +
            '<button type="button" class="copy-btn" onclick="copyPlainText(\'' + item.id + '\', \'prompt\', this)">COPY</button>' +
          '</div>' +
          '<div class="copyable-text">' + escapeHtml(item.prompt || '') + '</div>' +
        '</div>' +
        '<div class="modal-section-box">' +
          '<div class="modal-section-header">' +
            '<span class="modal-section-label">의상 프롬프트 (OUTFIT PROMPT)</span>' +
            '<button type="button" class="copy-btn" onclick="copyPlainText(\'' + item.id + '\', \'outfitPrompt\', this)">COPY</button>' +
          '</div>' +
          '<div class="copyable-text">' + escapeHtml(item.outfitPrompt || '') + '</div>' +
        '</div>';

      document.getElementById('personaModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closePersonaModal() {
      const modal = document.getElementById('personaModal');
      if (modal) modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closePersonaModal();
    });

    function addNewArchiveItem() {
      const count = appData.archives.filter(function(i) { return i.folder === currentFolder; }).length + 1;
      const newItem = {
        id: 'item-' + Date.now(),
        folder: currentFolder,
        title: currentFolder === 'persona' ? '페르소나 #' + count : '새 항목 #' + count,
        image: '',
        basicInfo: '',
        prompt: '',
        outfitPrompt: '',
        text: ''
      };
      appData.archives.unshift(newItem);
      saveData();
      renderArchives();
      showToast('새 아카이브 항목이 추가되었습니다.');
    }

    function updateArchive(id, field, value) {
      const target = appData.archives.find(function(item) { return item.id === id; });
      if (target) {
        target[field] = value;
        saveData();
        if (field === 'image') renderArchives();
      }
    }

    function deleteArchive(id) {
      if (!confirm('이 아카이브 항목을 삭제하시겠습니까?')) return;
      appData.archives = appData.archives.filter(function(item) { return item.id !== id; });
      saveData();
      renderArchives();
      showToast('항목이 삭제되었습니다.');
    }

    function handleArchiveImageUpload(event, id) {
      const file = event.target.files[0];
      if (!file) return;
      compressImage(file, 800, function(base64) {
        updateArchive(id, 'image', base64);
        showToast('이미지가 첨부되었습니다.');
      });
      event.target.value = '';
    }

    function toggleEditMode() {
      isEditing = !isEditing;
      const btn = document.getElementById('toggleEditBtn');
      if (isEditing) {
        closePersonaModal();
        document.body.classList.add('is-editing');
        if (btn) {
          btn.classList.add('active-mode');
          btn.innerText = '✓ DONE';
        }
      } else {
        document.body.classList.remove('is-editing');
        if (btn) {
          btn.classList.remove('active-mode');
          btn.innerText = '✎ EDIT MODE';
        }
        saveData();
        showToast('변경사항이 저장되었습니다.');
      }
      renderAll();
    }

    function openTab(tabName, btnElement) {
      document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      document.getElementById(tabName).classList.add('active');
      if (btnElement) btnElement.classList.add('active');
    }

    function filterFolder(folderName, btnElement) {
      currentFolder = folderName;
      document.querySelectorAll('.folder-btn').forEach(function(b) { b.classList.remove('active'); });
      if (btnElement) btnElement.classList.add('active');
      renderArchives();
    }

    function copyPlainText(id, field, btnElement) {
      const target = appData.archives.find(function(item) { return item.id === id; });
      if (!target) return;
      const textToCopy = target[field] || '';

      navigator.clipboard.writeText(textToCopy).then(function() {
        const originalText = btnElement.innerText;
        btnElement.innerText = 'COPIED';
        btnElement.classList.add('copied');
        showToast('COPIED TO CLIPBOARD');
        setTimeout(function() {
          btnElement.innerText = originalText;
          btnElement.classList.remove('copied');
        }, 1500);
      }).catch(function() {
        alert('복사에 실패했습니다. 텍스트를 직접 선택하여 복사해주세요.');
      });
    }

    function exportHTML() {
      const cloneDoc = document.documentElement.cloneNode(true);
      cloneDoc.querySelector('body').classList.remove('is-editing');
      cloneDoc.querySelector('body').style.overflow = '';
      cloneDoc.querySelector('#personaModal').classList.remove('open');
      const editBtn = cloneDoc.querySelector('#toggleEditBtn');
      if (editBtn) {
        editBtn.classList.remove('active-mode');
        editBtn.innerText = '✎ EDIT MODE';
      }

      const scripts = cloneDoc.querySelectorAll('script');
      const lastScript = scripts[scripts.length - 1];
      if (lastScript) {
        lastScript.textContent = lastScript.textContent.replace(
          /const DEFAULT_DATA = \{[\s\S]*?\n    \};/,
          'const DEFAULT_DATA = ' + JSON.stringify(appData, null, 2) + ';'
        );
      }

      const finalHtml = '<!DOCTYPE html>\n' + cloneDoc.outerHTML;
      downloadFile(finalHtml, 'index.html', 'text/html');
      showToast('최신 데이터가 반영된 index.html 다운로드 완료');
    }

    function exportJSON() {
      const jsonStr = JSON.stringify(appData, null, 2);
      downloadFile(jsonStr, 'archive-backup.json', 'application/json');
      showToast('백업 파일(JSON)이 다운로드되었습니다.');
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && parsed.profile && Array.isArray(parsed.archives)) {
            appData = parsed;
            saveData();
            renderAll();
            showToast('데이터 복원이 완료되었습니다.');
          } else {
            alert('올바른 백업 파일 형식이 아닙니다.');
          }
        } catch (err) {
          alert('파일을 읽는 중 오류가 발생했습니다.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function resetData() {
      if (!confirm('브라우저에 저장된 수정 내역을 지우고 초기 상태로 되돌리시겠습니까?')) return;
      localStorage.removeItem(STORAGE_KEY);
      appData = cloneDefaultData();
      renderAll();
      showToast('초기 데이터로 복원되었습니다.');
    }

    function compressImage(file, maxWidth, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.85));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function downloadFile(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[m];
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(function() {
        toast.classList.remove('show');
      }, 2200);
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>

</body>
</html>
